services:
  db:
    image: postgres:16
    container_name: cryptopostgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD} 
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  migrator:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    command: -path=/migrations/ -database=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable up
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cryptoservice_app
    restart: always
    ports:
    - "8080:8080"
    environment:
      - PATH_CONFIG=config/cryptoservice.yaml

      # 1. Передаем чистый ключ, который ваш метод CoingeckoAPIKey() заберет через os.Getenv("COINGECKO_API_KEY")
      - COINGECKO_API_KEY=${COINGECKO_API_KEY}
    depends_on:
      migrator:
        condition: service_completed_successfully